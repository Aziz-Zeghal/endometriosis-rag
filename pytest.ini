[pytest]
testpaths = ingestion/tests back/tests/tier1
pythonpath = ingestion/tests back/tests/tier1 back/tests/tier3
markers =
    live: needs network access or the LLM endpoint (deselect with -m "not live")
addopts = -m "not live" --import-mode=importlib
asyncio_default_fixture_loop_scope = function
