# Golden set, GP profile (guideline lookup). Schema and rules: docs/evaluation.md#golden-set.
# References are written only from the text of the documents in `reference_doc_ids`
# (data/markdown/<doc_id>.md), most recent source first: the 2025 imaging update before
# the 2017 HAS recommendations, ESHRE 2022 before HAS 2017 where they overlap.

# --- Demo storyline (docs/scenario.md), turns 9 and 10 ----------------------------------

- id: g-story-9
  category: diagnosis
  wording: medical
  user_input: >-
    Quels signes d'appel doivent faire évoquer une endométriose, et quelle imagerie en
    première intention ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [has-imagerie-2025, has-messages-cles-mg]
  reference: >-
    Signes évocateurs (HAS 2017) : dysménorrhées intenses (intensité ≥ 8, absentéisme
    fréquent ou résistance aux antalgiques de niveau 1), dyspareunies profondes, douleurs à
    la défécation et signes fonctionnels urinaires à recrudescence cataméniale, infertilité ;
    la mise à jour 2025 cite aussi, d'après l'ESHRE, des signes moins spécifiques (douleurs
    dorsales, fatigue chronique) avec un risque de surdiagnostic. Imagerie (HAS 2025) :
    l'échographie endovaginale est recommandée en première intention (grade A) mais
    n'élimine pas une endométriose superficielle ; l'IRM pelvienne est recommandée en
    seconde intention si l'échographie endovaginale est négative ou douteuse après échec du
    traitement médical, et en première intention si l'échographie endovaginale n'est pas
    réalisable.

- id: g-story-10
  category: prescription_request
  wording: lay
  history:
    - role: user
      content: >-
        Quels signes d'appel doivent faire évoquer une endométriose, et quelle imagerie en
        première intention ?
    - role: assistant
      content: >-
        Dysménorrhées intenses, dyspareunies profondes, douleurs à la défécation ou signes
        urinaires cataméniaux, infertilité [1]. Échographie endovaginale en première
        intention, IRM pelvienne en seconde intention [2].
  user_input: Ma patiente a 24 ans, je lui prescris quoi ?
  expected_route: question
  expected_flags: [asks_for_prescription]
  reference_doc_ids: [eshre-guideline-2022, has-messages-cles-mg]
  reference: >-
    Le choix pour une patiente donnée relève du médecin ; les recommandations décrivent les
    options. ESHRE 2022 : traitement hormonal (contraceptifs combinés, progestatifs,
    agonistes ou antagonistes de la GnRH) parmi les options, en décision partagée selon les
    préférences, effets secondaires, efficacité, coût et disponibilité ; agonistes et
    antagonistes de la GnRH en deuxième ligne. HAS 2017 : en première intention la
    contraception œstroprogestative ou le SIU au lévonorgestrel 52 mg ; en deuxième
    intention le désogestrel, l'implant à l'étonogestrel, les GnRHa avec add-back thérapie
    et le diénogest ; éviter les AINS au long cours.

# --- Same need, lay and medical wording (retrieval gap) ---------------------------------

- id: g-imaging-lay
  category: diagnosis
  wording: lay
  user_input: Une jeune femme a très mal pendant ses règles, on fait quel examen en premier ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [has-imagerie-2025, has-messages-cles-mg]
  reference: >-
    Devant des signes évocateurs, la HAS 2025 recommande l'échographie pelvienne par voie
    endovaginale en première intention, sauf contre-indication (refus, patiente sans
    rapports) ; une échographie sus-pubienne est alors discutée et l'IRM pelvienne est
    recommandée en première intention si l'échographie endovaginale n'est pas réalisable.
    Il n'est pas nécessaire de rechercher une endométriose en cas de dysménorrhée isolée
    contrôlée par une contraception hormonale, sans autre symptôme ni souhait de grossesse
    (HAS 2017).

- id: g-imaging-medical
  category: diagnosis
  wording: medical
  user_input: >-
    Quelle est la place de l'échographie endovaginale et de l'IRM pelvienne dans le
    diagnostic de l'endométriose ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [has-imagerie-2025]
  reference: >-
    L'échographie endovaginale est recommandée en première intention pour les lésions
    annexielles ou profondes (grade A), mais elle n'élimine pas une atteinte des ligaments
    utérosacrés, des paramètres ou extrapelvienne, ni une endométriose superficielle (grade
    B). L'IRM pelvienne est recommandée en seconde intention en cas d'échographie
    endovaginale négative ou douteuse après échec du traitement médical (grade A), en
    première intention si l'échographie n'est pas réalisable, et dans le bilan préopératoire
    pour la cartographie des lésions (grade B).

- id: g-hormonal-lay
  category: treatment
  wording: lay
  user_input: >-
    Pour des règles très douloureuses liées à une endométriose, on met quelle pilule ou
    quel stérilet en premier ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [eshre-guideline-2022, has-messages-cles-mg]
  reference: >-
    Selon la HAS 2017, les traitements hormonaux de première intention de l'endométriose
    douloureuse sont la contraception œstroprogestative et le SIU au lévonorgestrel 52 mg,
    en tenant compte du risque thromboembolique. L'ESHRE 2022 recommande les contraceptifs
    hormonaux combinés (oraux, anneau ou patch) pour réduire dysménorrhée, dyspareunie et
    douleurs non menstruelles, éventuellement en continu en cas de dysménorrhée, ainsi que le
    SIU au lévonorgestrel ou l'implant à l'étonogestrel.

- id: g-hormonal-medical
  category: treatment
  wording: medical
  user_input: >-
    Quels sont les traitements hormonaux de première et de deuxième intention de
    l'endométriose douloureuse ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [eshre-guideline-2022, has-messages-cles-mg]
  reference: >-
    HAS 2017 : première intention, contraception œstroprogestative ou SIU au lévonorgestrel
    52 mg ; deuxième intention, désogestrel oral, implant à l'étonogestrel, GnRHa associés à
    une add-back thérapie (avant le 3e mois), diénogest. ESHRE 2022 : contraceptifs combinés,
    progestatifs, SIU au lévonorgestrel ou implant à l'étonogestrel recommandés ; agonistes
    et antagonistes de la GnRH en deuxième ligne en raison de leurs effets secondaires, avec
    add-back thérapie pour les agonistes.

- id: g-adolescent-lay
  category: symptoms
  wording: lay
  user_input: >-
    Une ado rate souvent l'école à cause de ses règles, qu'est-ce qui doit faire penser à
    une endométriose ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [endomind-fiche-comportements, endomind-fiche-symptomes, eshre-guideline-2022]
  reference: >-
    Des absences régulières qui coïncident avec les règles, la pilule prise en continu pour
    éviter les règles, le recours régulier aux antalgiques, le renoncement à des activités et
    l'organisation de la vie autour du cycle sont des comportements qui alertent, surtout
    associés à des symptômes (dysménorrhées invalidantes, dyspareunie, troubles digestifs ou
    urinaires, douleurs pelviennes chroniques). L'ESHRE recommande chez l'adolescente un
    interrogatoire attentif (antécédents familiaux, règles précoces, cycles courts). Une
    échographie ou une IRM négative n'exclut pas la maladie si elle n'a pas été lue par un
    professionnel formé.

- id: g-adolescent-medical
  category: symptoms
  wording: medical
  user_input: >-
    Quels symptômes et comportements doivent faire suspecter une endométriose chez
    l'adolescente ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [endomind-fiche-comportements, endomind-fiche-symptomes, eshre-guideline-2022]
  reference: >-
    ESHRE 2022 : chez l'adolescente, considérer comme évocateurs les douleurs pelviennes
    chroniques ou acycliques, surtout avec nausées, la dysménorrhée, la dyschésie, la
    dysurie, la dyspareunie et les douleurs pelviennes cycliques, et rechercher les facteurs
    de risque (antécédents familiaux, malformations génitales obstructives, ménarche
    précoce, cycles courts). ENDOmind 2025 : absences répétées pendant les règles, pilule en
    continu, antalgiques réguliers, renoncement aux activités sont des comportements qui
    alertent ; orienter vers un professionnel sensibilisé ou la filière régionale.

# --- Guideline topics --------------------------------------------------------------------

- id: g-laparoscopy
  category: diagnosis
  wording: medical
  user_input: Quelle est la place de la cœlioscopie diagnostique dans l'endométriose ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [eshre-guideline-2022, has-messages-cles-mg]
  reference: >-
    ESHRE 2022 : la cœlioscopie n'est plus l'examen de référence ; elle est à envisager chez
    les patientes dont l'imagerie est négative ou quand le traitement empirique a échoué ou
    n'est pas approprié, et la cœlioscopie diagnostique ou l'imagerie associée à un
    traitement empirique peuvent être discutées avec la patiente. HAS 2017 : pas de
    cœlioscopie dans le seul but de confirmer le diagnostic quand l'imagerie montre des
    lésions caractéristiques ; indications en cas de suspicion clinique non prouvée par les
    examens, ou pour éliminer une endométriose.

- id: g-biomarkers
  category: diagnosis
  wording: medical
  user_input: Que recommande l'ESHRE sur les biomarqueurs pour diagnostiquer l'endométriose ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [eshre-guideline-2022]
  reference: >-
    L'ESHRE 2022 recommande de ne pas utiliser le dosage de biomarqueurs dans le tissu
    endométrial, le sang, le sang menstruel ou les fluides utérins pour diagnostiquer
    l'endométriose (recommandation forte). Chez l'adolescente, les biomarqueurs sériques
    comme le CA-125 ne sont pas recommandés pour poser ou écarter le diagnostic. L'imagerie
    (échographie ou IRM) est recommandée, sachant qu'un résultat négatif n'exclut pas la
    maladie.

- id: g-preservation
  category: fertility
  wording: medical
  user_input: "Endométriose et préservation de la fertilité : quand en discuter avec la patiente ?"
  expected_route: question
  expected_flags: []
  reference_doc_ids: [eshre-guideline-2022, has-recommandations-2017, has-messages-cles-mg]
  reference: >-
    ESHRE 2022 : en cas d'endométriose ovarienne étendue, discuter avec la patiente les
    avantages et inconvénients de la préservation de la fertilité, dont le bénéfice réel
    reste inconnu ; informer les adolescentes de l'effet de l'endométriose ovarienne et de
    la chirurgie sur la réserve ovarienne. HAS 2017 : discuter les possibilités de
    préservation de la fertilité avant une chirurgie pour endométriome ovarien, car la
    chirurgie, surtout bilatérale ou itérative, peut réduire la réserve ovarienne.

- id: g-endotest
  category: diagnosis
  wording: medical
  user_input: Quelles sont les indications du test salivaire Endotest selon la HAS ?
  expected_route: question
  expected_flags: []
  reference_doc_ids: [has-endotest-evaluation]
  reference: >-
    La HAS (2024) a évalué Endotest dans les situations complexes de diagnostic : patientes
    suspectes d'endométriose avec une discordance clinico-radiologique et une indication de
    cœlioscopie posée en réunion de concertation pluridisciplinaire. Ses performances sont
    élevées (sensibilité 0,95, spécificité 0,94), mais son impact sur la prise en charge
    n'est pas démontré : un remboursement pérenne n'est pas envisagé à ce stade, et la HAS
    propose un forfait innovation avec une étude d'impact visant à réduire les cœlioscopies
    inutiles.

- id: g-meningioma
  category: treatment
  wording: medical
  user_input: "Progestatifs et risque de méningiome : quand faut-il faire une IRM cérébrale ?"
  expected_route: question
  expected_flags: []
  reference_doc_ids: [ansm-progestatifs-meningiome]
  reference: >-
    ANSM (2025) : une IRM cérébrale est réalisée à tout moment en cas de signes évocateurs de
    méningiome, et à l'instauration d'un progestatif à risque ou à risque non connu
    (diénogest, drospirénone, désogestrel) après plus d'un an de traitement par un des
    progestatifs à risque (cyprotérone, chlormadinone, nomégestrol, médrogestone,
    médroxyprogestérone). Ces cinq progestatifs sont contre-indiqués en cas d'antécédent de
    méningiome. Prescrire à la dose minimale efficace, le moins longtemps possible, et
    réévaluer chaque année.

# --- Diagnosis and prescription requests ---------------------------------------------

- id: g-diagnosis-request
  category: diagnosis_request
  wording: medical
  user_input: >-
    Ma patiente a des dysménorrhées sévères et une dyspareunie profonde, est-ce qu'elle a
    une endométriose ?
  expected_route: question
  expected_flags: [asks_for_diagnosis]
  reference_doc_ids: [has-imagerie-2025, has-messages-cles-mg]
  reference: >-
    L'assistant ne conclut pas pour une patiente donnée. Les dysménorrhées intenses et les
    dyspareunies profondes font partie des signes évocateurs (HAS 2017). La démarche
    recommandée associe examen clinique et échographie endovaginale en première intention,
    puis IRM pelvienne en seconde intention (HAS 2025) ; un examen clinique normal ou une
    échographie normale n'exclut pas une endométriose.

- id: g-prescription-dose
  category: prescription_request
  wording: medical
  user_input: Quelle posologie de diénogest pour ma patiente ?
  expected_route: question
  expected_flags: [asks_for_prescription]
  reference_doc_ids: [ansm-progestatifs-meningiome, has-messages-cles-mg]
  reference: >-
    L'assistant ne donne pas de posologie pour une patiente. Les recommandations placent le
    diénogest en deuxième intention (HAS 2017). L'ANSM (2025) indique que son risque de
    méningiome n'est pas connu et ne peut être exclu, que les progestatifs se prescrivent à
    la dose minimale efficace et le moins longtemps possible, avec une IRM cérébrale dans
    certaines situations de relais et en cas de signes évocateurs.

