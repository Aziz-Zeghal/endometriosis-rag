[project]
name = "endorag-back"
version = "0.1.0"
description = "Backend: FastAPI + LangGraph conversation graph over the ingestion index"
requires-python = ">=3.12"
dependencies = [
    "endorag-ingestion",
    "fastapi>=0.165",
    "uvicorn[standard]>=0.34",
    "langgraph>=1.2",
    "langchain-openai>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/endorag_back"]
